[project]
name = "ai-dataset-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Melody Egwuchukwu", email = "melodyegwuchukwu1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.46.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-dataset-agent = "ai_dataset_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]